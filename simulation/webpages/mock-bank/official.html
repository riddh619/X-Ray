<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DemoBank Alpha - Secure Banking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            demo: {
              bg: '#0a0f1a',
              card: '#111827',
              accent: '#06b6d4',
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --font-sans: 'Inter', system-ui, sans-serif;
    }
    body {
      font-family: var(--font-sans);
    }
  </style>
</head>
<body class="bg-demo-bg text-demo-text min-h-screen">

  <div class="max-w-md mx-auto p-6">

    <!-- Header -->
    <header class="mb-8 text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-demo-accent mb-4">
        <svg className="w-6 h-6 text-white" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="#0a0f1a" stroke="#06b6d4" strokeWidth="2" />
          <path d="M8 8l16 16M24 8L8 24" stroke="#06b6d4" strokeWidth="2" strokeLinecap="round" />
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white tracking-tight">DemoBank Alpha</h1>
      <p class="text-white/60 mt-2">Secure Online Banking</p>
    </header>

    <!-- Login Form -->
    <main class="bg-[#1e293b] rounded-2xl p-8 max-w-sm mx-auto border border-[#334155]">
      <h2 class="text-xl font-semibold text-white mb-6">Sign in securely</h2>

      <form id="login-form" novalidate>
        <div class="mb-4">
          <label class="block text-sm font-medium text-white/60 mb-2">Username</label>
          <input
            type="text"
            name="username"
            id="username"
            class="w-full px-4 py-3 rounded-xl bg-[#0f172a] border border-[#334155] text-white placeholder-white/40 focus:outline-none focus:border-demo-accent focus:shadow-demo-accent/20"
            placeholder="Enter username"
            required
          />
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-white/60 mb-2">Password</label>
          <input
            type="password"
            name="password"
            id="password"
            class="w-full px-4 py-3 rounded-xl bg-[#0f172a] border border-[#334155] text-white placeholder-white/40 focus:outline-none focus:border-demo-accent focus:shadow-demo-accent/20"
            placeholder="Enter password"
            required
          />
        </div>

        <button
          type="submit"
          class="w-full px-6 py-3 rounded-xl bg-demo-accent text-white font-medium hover:bg-[#0891b2] transition-colors"
        >
          Continue
        </button>
      </form>

      <p class="text-xs text-white/60 mt-6 text-center">
        Demo environment only - no real authentication
      </p>
    </main>

  </div>

  <script type="module">
    // Canonical DemoBank instrumentation
    // This page demonstrates legitimate behavior
    // All network activity is same-origin or to legitimate third parties

    // Example: legitimate analytics (same-origin)
    // In production, this would be replaced with real analytics SDKs

    document.getElementById('login-form')?.addEventListener('submit', async (e) => {
      e.preventDefault()

      const formData = new FormData(e.target as HTMLFormElement)
      const data = Object.fromEntries(formData.entries())

      // Simulate legitimate form submission
      const submitBtn = e.target.querySelector('button[type="submit"]') as HTMLButtonElement
      submitBtn.disabled = true
      submitBtn.textContent = 'Signing in...'

      // Brief delay to simulate auth
      await new Promise(resolve => setTimeout(resolve, 1500))

      // In a real app, this would POST to the bank's auth API
      // For this demo, we navigate to OTP screen
      window.location.href = '/mock-bank/otp.html'
    })
  </script>
</body>
</html>
