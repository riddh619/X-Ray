<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DemoBank Alpha - Secure Online Banking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/mock-bank/styles.css" />
</head>
<body class="bg-[#0a0f1a] text-[#f1f5f9] min-h-screen flex items-center justify-center p-6">

  <div class="max-w-md w-full bg-[#111827] border border-[#1f2937] rounded-2xl p-8 shadow-xl">

    <!-- Header -->
    <header class="mb-6 text-center">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-[#06b6d4]/20 border border-[#06b6d4]/30 text-[#06b6d4] mb-3">
        <svg class="w-8 h-8" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="#0a0f1a" stroke="#06b6d4" stroke-width="2" />
          <path d="M8 8l16 16M24 8L8 24" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white tracking-tight">DemoBank Alpha</h1>
      <p class="text-xs text-[#94a3b8] mt-1">Official Verified Banking Portal</p>
    </header>

    <div class="bg-[#0f172a] border border-[#1f2937] rounded-xl p-3 mb-6 flex items-center justify-between text-xs">
      <span class="text-[#94a3b8]">Verified Domain:</span>
      <span class="text-[#10b981] font-mono font-medium">demo-bank-a.example</span>
    </div>

    <!-- Login Form -->
    <form id="login-form" novalidate>
      <div class="mb-4">
        <label for="username" class="block text-sm font-medium text-[#94a3b8] mb-2">Username / Customer ID</label>
        <input
          type="text"
          name="username"
          id="username"
          class="w-full px-4 py-3 rounded-xl bg-[#0f172a] border border-[#334155] text-white placeholder-[#64748b] focus:outline-none focus:border-[#06b6d4] transition-colors"
          placeholder="e.g. user_alpha"
          value="demo_customer"
          required
        />
      </div>

      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-[#94a3b8] mb-2">Password</label>
        <input
          type="password"
          name="password"
          id="password"
          class="w-full px-4 py-3 rounded-xl bg-[#0f172a] border border-[#334155] text-white placeholder-[#64748b] focus:outline-none focus:border-[#06b6d4] transition-colors"
          placeholder="Enter password"
          value="SuperSecret123!"
          required
        />
      </div>

      <button
        type="submit"
        id="submit-btn"
        class="w-full px-6 py-3 rounded-xl bg-[#06b6d4] text-white font-semibold hover:bg-[#0891b2] transition-colors shadow-lg shadow-[#06b6d4]/20"
      >
        Continue to OTP Verification
      </button>
    </form>

    <p class="text-[11px] text-[#64748b] mt-6 text-center">
      Legitimate simulation environment · No real credentials processed
    </p>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Verifying credentials...';

      setTimeout(function () {
        window.location.href = '/mock-bank/otp.html';
      }, 700);
    });
  </script>
</body>
</html>
